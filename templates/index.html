{% extends 'base.html' %}
{% block content %}
    <main>
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker">Computer Science &middot; Universitas Indonesia</p>
                    <h1>{{name}}</h1>
                </div>
                <div class="hero-photo">
                    <div class="photo-block"></div>
                    <img class="avatar" src="/static/img/foto ui.jpeg" alt="Photo of {{name}}">
                </div>
                <div class="hero-details">
                    <p class="bio"> {{bio}}</p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{npm}}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{study_program}}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Sesi Terakhir Login</dt>
                            <dd>{{ last_login }}</dd>
                        </div>
                    </dl>
                    <div class="social-links">
                        <a href="https://github.com/aufagit" class="social-link"> <i class="fa-brands fa-github"> </i></a>
                        <a href="https://www.linkedin.com/in/aufa-nurcahyo-0449b5379/" class="social-link"> <i class="fa-brands fa-linkedin"> </i></a>
                        <a href="mailto:nurcahyoaufa@gmail.com" class="social-link"> <i class="fa-solid fa-envelope"> </i> </a>
                    </div>
                </div>
            </div>
        </section>
    </main>
{% endblock content %}
